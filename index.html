}

:root[data-theme="dark"]{

[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}

h1{font-size:1.45rem;font-weight:800}

p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.daynav{display:flex;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.plain{background:transparent;border-style:dashed}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}

.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}

.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn[disabled]{opacity:.35}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.ringbox{position:relative;width:132px;height:132px}
.ring{width:132px;height:132px;display:block}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:var(--surface2)}
.ring .bar{stroke:var(--accent);stroke-linecap:round}

.ringc b{font-family:var(--display);font-size:1.7rem;font-weight:800;line-height:1.1}
.ringc span{font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.stat span{display:block;font-size:.76rem;color:var(--muted)}
.stat b{font-family:var(--display);font-size:1.15rem;font-weight:700}
.insight{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.insight.warn{background:var(--warn-soft)}

.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.bar i.p{background:var(--protein)} .bar i.c{background:var(--carb)} .bar i.f{background:var(--fat)} .bar i.w{background:var(--protein)} .bar i.over{background:var(--warn)}

.entry{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.entry .en{min-width:0;overflow-wrap:anywhere}

.entry .ek{white-space:nowrap;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}

.tab.on{color:var(--accent);font-weight:700}
.tab.add .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-22px;border:4px solid var(--bg)}
.tab.add{color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,15,11,.55)}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.85rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:44px;min-width:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.err{color:var(--warn);font-size:.88rem}

function bmiOf(w,h){return w/((h/100)*(h/100));}

function calcTargets(p){
  const w=+p.w,h=+p.h,a=+p.age;
  const bmr=10*w+6.25*h-5*a+(p.sex==='m'?5:-161);
  const tdee=bmr*(ACTLV[p.activity]?ACTLV[p.activity][2]:1.2);
  const b=bmiOf(w,h);
  let pct=PACE[p.pace]?PACE[p.pace][2]:0.2;
  let maintain=false;
  if(b<18.5||(p.goalW&&+p.goalW>=w)){pct=0;maintain=true;}
  let kcal=tdee*(1-pct);
  const floor=p.sex==='m'?1500:1200;
  let floored=false;
  if(!maintain){
    kcal=Math.max(kcal,tdee-1000);
    if(kcal<floor){kcal=floor;floored=true;}
  }
  kcal=Math.round(kcal/10)*10;
  const ref=Math.min(w,27*(h/100)*(h/100));
  const gpk=(+p.strength>=2)?2.0:1.8;
  let pro=Math.round(ref*gpk);
  pro=Math.min(pro,Math.round(kcal*0.40/4));
  let fat=Math.max(Math.round(kcal*0.25/9),Math.round(ref*0.6));
  fat=Math.min(fat,Math.round(kcal*0.35/9));
  let carb=Math.round((kcal-pro*4-fat*9)/4);
  if(carb<50){carb=50;fat=Math.max(Math.round(ref*0.5),Math.round((kcal-pro*4-carb*4)/9));}
  const fiber=clamp(Math.round(14*kcal/1000),25,35);
  const waterMl=clamp(Math.round(w*35/250)*250,2000,3500);
  const deficit=Math.round(tdee-kcal);
  const weekly=maintain?0:deficit*7/7700;
  const kgToLose=p.goalW?Math.max(0,w-(+p.goalW)):0;
  const weeks=weekly>0?Math.ceil(kgToLose/weekly):0;
  const minGoal=Math.round(18.5*(h/100)*(h/100)*10)/10;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:kcal,p:pro,c:carb,f:fat,fiber:fiber,waterMl:waterMl,deficit:deficit,weekly:weekly,weeks:weeks,bmi:b,maintain:maintain,floored:floored,floor:floor,minGoal:minGoal,ref:ref};
}

function nut(food,g){const m=g/100;return {k:food.k*m,p:food.p*m,c:food.cb*m,f:food.f*m,fi:food.fi*m};}
function sumE(list){const t={k:0,p:0,c:0,f:0,fi:0};for(const e of list){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.fi+=e.fi||0;}return t;}

if(typeof module!=='undefined'){module.exports={calcTargets,nut,sumE,bn,num,bmiOf,ACTLV,PACE,EXS};}

/* ===== helpers for logic ===== */
function recentFoods(){
  const out=[],seen={};
  const keys=Object.keys(S.log).sort().reverse().slice(0,14);
  for(const k of keys){
    const d=S.log[k];if(!d||!d.meals)continue;
    for(const m of MEALS){
      const list=(d.meals[m[0]]||[]).slice().reverse();
      for(const e of list){
        if(e.ai||seen[e.fid]||!findFood(e.fid))continue;
        seen[e.fid]=1;out.push(e);if(out.length>=8)return out;
      }
    }
  }
  return out;
}
function exTotals(k){const d=S.log[k];let kc=0,min=0,st=0;if(d&&d.ex){for(const x of d.ex){kc+=x.kcal;min+=x.min;if(x.str)st++;}}return {kcal:kc,min:min,str:st};}
function lastDays(n,endK){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(endK||todayK(),-i));return a;}
function loggedKcalDays(keys){return keys.filter(k=>dayTotals(k).k>0);}
function streak(fn){let k=todayK();if(!fn(k))k=addDays(k,-1);let n=0;while(n<400&&fn(k)){n++;k=addDays(k,-1);}return n;}

function weightSeries(){
  const ks=Object.keys(S.weights).sort();
  return ks.map(k=>({k:k,w:S.weights[k]}));
}
function movAvg(series,i){
  const t=pkey(series[i].k).getTime();let s=0,c=0;
  for(let j=0;j<=i;j++){if(t-pkey(series[j].k).getTime()<=6*864e5){s+=series[j].w;c++;}}
  return s/c;
}

function chartWeight(series,goal){
  if(series.length<2)return '<p class="note">কমপক্ষে দুই দিনের ওজন লিখলে গ্রাফ দেখা যাবে।</p>';
  const pts=series.slice(-45);
  const W=340,H=170,pl=36,pr=10,pt=10,pb=22;
  const avgs=pts.map((x,i)=>movAvg(series,series.length-pts.length+i));
  let lo=Math.min.apply(null,pts.map(x=>x.w).concat(avgs)),hi=Math.max.apply(null,pts.map(x=>x.w).concat(avgs));
  const showGoal=goal&&goal<lo&&lo-goal<=3?true:(goal&&goal>=lo&&goal<=hi);
  if(showGoal){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  lo=Math.floor((lo-0.5)*2)/2;hi=Math.ceil((hi+0.5)*2)/2;
  const t0=pkey(pts[0].k).getTime(),t1=pkey(pts[pts.length-1].k).getTime();
  const X=k=>pl+(t1===t0?0:(pkey(k).getTime()-t0)/(t1-t0))*(W-pl-pr);
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="ওজনের গ্রাফ">';
  for(let i=0;i<3;i++){const v=lo+(hi-lo)*i/2;s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(pl-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+num(v,1)+'</text>';}
  if(showGoal)s+='<line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'"/><text x="'+(W-pr)+'" y="'+(Y(goal)-4).toFixed(1)+'" text-anchor="end">লক্ষ্য '+num(goal,1)+'</text>';
  pts.forEach(x=>{s+='<circle class="dot" cx="'+X(x.k).toFixed(1)+'" cy="'+Y(x.w).toFixed(1)+'" r="2.4"/>';});
  s+='<polyline class="avg" points="'+pts.map((x,i)=>X(x.k).toFixed(1)+','+Y(avgs[i]).toFixed(1)).join(' ')+'"/>';
  s+='<text x="'+pl+'" y="'+(H-6)+'">'+esc(dlabel(pts[0].k,{day:'numeric',month:'short'}))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(dlabel(pts[pts.length-1].k,{day:'numeric',month:'short'}))+'</text></svg>';
  return s;
}

}

function findByPrefix(pre){return allFoods().find(f=>f.n.indexOf(pre)===0);}
function suggestMeals(remK,remP){
  const cands=[['রুই মাছ',70],['তেলাপিয়া',80],['মুরগির বুক',100],['চিংড়ি',100],['মুরগির ডিম',50],['মুগ ডাল',150],['টক দই',100],['কাতলা',70],['ছোলা (সিদ্ধ)',100],['মুরগির মাংস',70]];
  const vegs=['ঢেঁড়স','লাউ','পটল','ফুলকপি','বাঁধাকপি','মিশ্র সবজি'];
  const out=[];let vi=0;
  const need=clamp(remP,15,40);
  for(const c of cands){
    const f=findByPrefix(c[0]);if(!f)continue;
    let g=clamp(Math.round(need*0.9/(f.p/100)/10)*10,40,300);
    if(nut(f,g).k>remK*0.7)g=Math.floor(remK*0.7/(f.k/100)/10)*10;
    if(g<30)continue;
    const items=[[f,g]];
    const v=findByPrefix(vegs[vi++%vegs.length]);if(v)items.push([v,120]);
    const sal=findByPrefix('সালাদ');if(sal&&remK>250)items.push([sal,100]);
    let tot=sumE(items.map(x=>{const n=nut(x[0],x[1]);return {k:n.k,p:n.p,c:n.c,f:n.f,fi:n.fi};}));
    if(remK-tot.k>170){
      const rice=findByPrefix('রান্না ভাত');
      if(rice){const rg=clamp(Math.round((remK-tot.k-30)/1.3/10)*10,50,150);items.push([rice,rg]);tot=sumE(items.map(x=>{const n=nut(x[0],x[1]);return {k:n.k,p:n.p,c:n.c,f:n.f,fi:n.fi};}));}
    }
    if(tot.k<=remK+40)out.push({items:items,tot:tot});
    if(out.length>=3)break;
  }
  return out;
}
function swapOptions(food,g){
  const n0=nut(food,g);
  const grp={grain:'carb',fruit:'carb',fish:'prot',meat:'prot',egg:'prot',dairy:'prot',pulse:'prot',veg:'veg',snack:'snack',fat:'fat',drink:'drink',mine:'prot'};
  const gr=grp[food.c]||'carb';
  let pool=allFoods().filter(f=>f.id!==food.id&&f.k>=10);
  if(gr==='snack')pool=pool.filter(f=>['fruit','dairy','pulse','egg'].indexOf(f.c)>=0&&f.n.indexOf('হুই')<0&&f.n.indexOf('তেল')<0);
  else pool=pool.filter(f=>(grp[f.c]||'carb')===gr);
  const res=pool.map(f=>{
    let g2=g*food.k/f.k;g2=clamp(g2,10,500);
    const n=nut(f,g2);return {f:f,g:Math.round(g2/5)*5,n:n};
  });
  if(gr==='prot'||gr==='snack')res.sort((a,b)=>b.n.p/Math.max(1,b.n.k)-a.n.p/Math.max(1,a.n.k));
  else if(gr==='carb')res.sort((a,b)=>b.n.fi-a.n.fi);
  else res.sort((a,b)=>a.n.k-b.n.k);
  return {base:n0,list:res.slice(0,6)};
}

  s+='আজকের খাবার: '+(lines.length?lines.join('; '):'এখনো কিছু লগ হয়নি')+'।\n';
  const ex=exTotals(k);s+='আজকের ব্যায়াম: '+ex.min+' মিনিট।';
  return s;
}

function draftFromProfile(p){return p?{name:p.name||'',sex:p.sex,age:p.age,h:p.h,w:latestWeight(),goalW:p.goalW,activity:p.activity,strength:p.strength,pace:p.pace}:{name:'',sex:'m',age:30,h:168,w:78,goalW:70,activity:'light',strength:2,pace:'mid'};}
function getDraft(){if(!ui.draft)ui.draft=draftFromProfile(S.profile);return ui.draft;}
function readDraft(){
  const d=getDraft();const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const chk=n=>{const e=document.querySelector('input[name='+n+']:checked');return e?e.value:null;};
  if(!document.getElementById('p-age'))return d;
  d.name=g('p-name')||'';d.sex=chk('sex')||d.sex;d.age=g('p-age');d.w=g('p-w');d.goalW=g('p-goal');
  {const ft=+g('p-ft'),inn=+g('p-in');d.h=(ft||inn)?((ft*12+inn)*2.54).toFixed(1):'';}
  d.activity=chk('activity')||d.activity;d.pace=chk('pace')||d.pace;d.strength=g('p-str');
  return d;
}
function validateDraft(d){
  const errs=[];const age=+d.age,h=+d.h,w=+d.w,gw=+d.goalW;
  if(!(age>=18&&age<=80))errs.push('বয়স ১৮ থেকে ৮০ এর মধ্যে হতে হবে। ১৮ বছরের কম বয়সীদের জন্য এই অ্যাপের ডায়েট হিসাব নয়, ডাক্তারের পরামর্শ নিন।');
  if(!(h>=120&&h<=220))errs.push('উচ্চতা ৪ ফুট থেকে ৭ ফুট ২ ইঞ্চির মধ্যে দিন (ফুট ও ইঞ্চি আলাদা ঘরে)।');
  if(!(w>=30&&w<=250))errs.push('ওজন ৩০ থেকে ২৫০ কেজির মধ্যে দিন।');
  if(!(gw>=30&&gw<=250))errs.push('লক্ষ্য ওজন দিন।');
  return {ok:!errs.length,errs:errs,p:{name:String(d.name||'').trim().slice(0,40),sex:d.sex,age:age,h:h,w:w,goalW:gw,activity:d.activity,strength:+d.strength||0,pace:d.pace}};
}

  const T=getTargets(),tot=dayTotals(ui.date);const after=tot.k+n.k;const out=[];

  else out.push('যোগ করলে আজ মোট '+num(after)+' / '+num(T.kcal)+' কিলোক্যালরি হবে, বাকি থাকবে '+num(T.kcal-after)+'।');
  if(n.p*4/n.k>=0.3&&n.p>=5)out.push('ভালো প্রোটিন উৎস, পেশি রক্ষায় সাহায্য করবে।');

  return out.join(' ');
}

function parseJsonLoose(t){
  try{return JSON.parse(t);}catch(e){}
  const fence=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence){try{return JSON.parse(fence[1]);}catch(e){}}
  const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));
  if(a>=0&&z>a){try{return JSON.parse(t.slice(a,z+1));}catch(e){}}
  throw {code:'invalid_json',message:'no json',text:t};
}
function toJpegB64(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.85).split(',')[1]);};
    im.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image_rejected',message:'bad image'});};
    im.src=url;
  });
}

  const call=async(input,opts,asJson)=>{
    opts=opts||{};
    const raw=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const msgs=[];for(const m of raw){const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else msgs.push({role:m.role,content:m.content});}
    if(opts.images){
      const imgs=Array.isArray(opts.images)?opts.images:[opts.images];const blocks=[];
      for(const f of imgs)blocks.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toJpegB64(f)}});
      const l=msgs[msgs.length-1];l.content=blocks.concat([{type:'text',text:l.content}]);
    }
    let res;
    try{
      const payload={model:'claude-sonnet-5-5',max_tokens:asJson?2000:1200,messages:msgs};
      if(proxy){const tk=await proxy.token();res=await fetch(proxy.url,{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','authorization':'Bearer '+tk},body:JSON.stringify(payload)});}
      else res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)});
    }catch(e){throw {code:(e&&e.name==='AbortError')?'cancelled':'upstream_error',message:String(e&&e.message||e)};}
    if(!res.ok)throw {code:res.status===401?'session_expired':res.status===403?'not_granted':res.status===429?'rate_limited':'upstream_error',message:'http '+res.status};
    const j=await res.json();
    const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    if(!text)throw {code:'empty_completion',message:'empty'};
    if(opts.onText)opts.onText({text:text,delta:text});
    return {text:text,truncated:j.stop_reason==='max_tokens'};
  };
  const f=(i,o)=>call(i,o,false);
  f.json=async(i,o)=>parseJsonLoose((await call(i,o,true)).text);
  f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:1,maxInputBytes:20971520,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}});
  return f;
}

const PHOTO_RULES='সংযুক্ত ছবিতে খাবার আছে। ছবির প্রতিটি খাবার শনাক্ত করো এবং আনুমানিক ওজন (গ্রাম) বলো। তারপর প্রতিটির এবং মোট কিলোক্যালরি, প্রোটিন, কার্ব, ফ্যাট ও ফাইবার সংক্ষেপে বলো। শেষে আজকের লক্ষ্যের সাথে তুলনায় এটি কেমন তা এক-দুই লাইনে বলো। ছবি দেখে হিসাব অনুমান, এটা জানাও। ছবিতে খাবার না থাকলে সেটা বলো।';
async function sendChat(text){
  if(!AI.sample||ui.busy)return;

  if(!text&&photo)text='এই খাবারের ছবি দেখে পুষ্টি উপাদান বলুন।';
  if(!text)return;
  const last={role:'assistant',text:'',pending:true,photo:!!photo};
  ui.chat.push({role:'user',text:(photo?'(ছবি সহ) ':'')+text});ui.chat.push(last);

  ui.busy=true;render(true);

  const hist=ui.chat.filter(m=>!m.pending&&!m.err).slice(-8);
  const turns=[{role:'user',content:CHAT_RULES+'\n\n'+contextText()}].concat(hist.map(m=>({role:m.role,content:m.text})));
  if(photo)turns[turns.length-1].content=text+'\n\n'+PHOTO_RULES;
  const ctl=new AbortController();ui.ctl=ctl;
  const opts={cache:false,signal:ctl.signal,modelTier:photo?'default':'quick',onText:u=>{

  }};
  if(photo)opts.images=photo;

  }catch(e){
    if(e&&e.text){last.text=e.text;}else{last.text=aiErr(e)||'থামানো হয়েছে।';last.err=true;}
  }

function aiPrompt(photo){
  const list=FOODS.map(f=>f.id.slice(1)+':'+f.n).join('\n');
  return 'You are a nutrition assistant for Bangladeshi food. '+(photo?'The attached photo shows a meal. Identify each distinct food item visible and estimate the cooked weight in grams of each.':'The user (Bengali or English) describes what they ate. Convert it into items with gram weights.')+' Reply with ONLY a JSON array. Each element: {"id": number or null, "name": Bengali food name, "grams": number, "meal": "b"|"l"|"d"|"s"|null, "kcal": number, "p": number, "c": number, "f": number, "fi": number}. "id" is the id from the FOOD LIST when a good match exists (the app then uses that food\'s per-100g nutrition); otherwise null, and then kcal, p (protein g), c (carbs g), f (fat g), fi (fiber g) are TOTALS for the portion eaten. When the quantity is vague use typical Bangladeshi portions: 1 cup cooked rice = 160 g, 1 roti = 40 g, 1 piece of fish = 60 g, 1 egg = 50 g, 1 bowl dal = 150 g. meal: b=breakfast, l=lunch, d=dinner, s=snack, or null if not stated. At most 12 items.\n\nFOOD LIST (id:name):\n'+list;
}
async function runAI(kind,file){
  if(!AI.sample||ui.ai.busy)return;
  const a=ui.ai;a.err='';a.items=[];
  let input,opts;
  if(kind==='text'){
    const t=($('#aitext')||{}).value||'';
    if(!t.trim()){a.err='কী খেয়েছেন লিখুন।';renderAIres();return;}
    input=aiPrompt(false)+'\n\nUSER TEXT:\n'+t.slice(0,2000);opts={modelTier:'quick'};
  }else{
    const f=file||($('#aiphoto')&&$('#aiphoto').files[0]);if(!f)return;
    input=aiPrompt(true);opts={images:f};
  }
  const ctl=new AbortController();a.ctl=ctl;opts.signal=ctl.signal;a.busy=true;renderAIres();
  try{
    const res=await AI.sample.json(input,opts);
    const arr=Array.isArray(res)?res:(res&&Array.isArray(res.items)?res.items:[]);
    for(const x of arr.slice(0,12)){
      const g=clamp(+x.grams||0,5,1500);if(!g)continue;
      let food=null;
      if(x.id!=null){food=FOODS.find(f=>f.id==='f'+x.id)||null;}
      if(!food){
        const k=+x.kcal||0;if(k<=0)continue;
        food={id:'ai_'+uid(),n:String(x.name||'খাবার').slice(0,50),c:'mine',k:k*100/g,p:(+x.p||0)*100/g,cb:(+x.c||0)*100/g,f:(+x.f||0)*100/g,fi:(+x.fi||0)*100/g,u:[],a:''};
      }
      const meal=['b','l','d','s'].indexOf(x.meal)>=0?x.meal:ui.meal;
      a.items.push({food:food,g:g,meal:meal});
    }
    if(!a.items.length)a.err='খাবার শনাক্ত করা যায়নি। আরেকটু পরিষ্কার করে লিখুন।';
  }catch(e){a.err=aiErr(e);}
  a.busy=false;a.ctl=null;renderAIres();
}

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  const rows=[['তারিখ','বেলা','খাবার','পরিমাণ (গ্রাম)','ক্যালরি','প্রোটিন','কার্ব','ফ্যাট','ফাইবার']];
  for(const k of Object.keys(S.log).sort()){const d=S.log[k];if(!d||!d.meals)continue;for(const m of MEALS){for(const e of (d.meals[m[0]]||[])){rows.push([k,m[1],e.n,e.g,e.k,e.p,e.c,e.f,e.fi]);}}}
  return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n');
}

/* ===== cloud sync (per-user private doc via db capability) ===== */
function cloudRef(){return CLOUD.db.doc(CLOUD.path);}
function cloudSoon(){if(!CLOUD.on)return;clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudPush,1500);}
async function cloudPush(){
  if(!CLOUD.on)return;
  if(CLOUD.busy){CLOUD.again=true;return;}
  CLOUD.busy=true;
  try{await cloudRef().set({ts:S._ts||Date.now(),json:JSON.stringify(S)});CLOUD.err='';CLOUD.at=Date.now();}
  catch(e){CLOUD.err=(e&&e.code)||'error';}
  CLOUD.busy=false;
  if(CLOUD.again){CLOUD.again=false;cloudSoon();}
}
async function startCloud(db,path){
  try{
    CLOUD.db=db;CLOUD.path=path;
    const snap=await cloudRef().get();
    CLOUD.on=true;
    let remote=null;
    if(snap.exists){try{const d=snap.data();remote={ts:+d.ts||0,s:JSON.parse(d.json)};}catch(e){}}
    const localTs=+S._ts||0;const localHad=!!S.profile;
    if(remote&&remote.s&&(remote.s.profile||Object.keys(remote.s.log||{}).length)&&remote.ts>localTs){
      S=Object.assign(defState(),remote.s);S._ts=remote.ts;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      refreshDatalist();if(S.profile&&ui.tab==='me'&&!localHad){ui.tab='today';ui.draft=null;}if(!ui.sheet)render(true);
    }else if(S.profile||Object.keys(S.log).length){await cloudPush();}
    CLOUD.at=CLOUD.at||Date.now();
    if(ui.tab==='me'&&!ui.sheet)render(true);
  }catch(e){CLOUD.err=(e&&e.code)||'error';}
}
async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    await startCloud(db,'data/users/'+id+'/state');
  }catch(e){CLOUD.err=(e&&e.code)||'error';}
}

/* ===== web mode: Firebase login + Firestore + AI proxy (only when WEBCFG set, outside Claude) ===== */
const WEB={user:null,auth:null,ready:false,mods:null,err:''};
async function webInit(){
  if(!window.WEBCFG||window.claude)return;
  try{
    const V='10.14.1',B='https://www.gstatic.com/firebasejs/'+V+'/';
    const [A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(WEBCFG.firebase);
    WEB.auth=Au.getAuth(app);WEB.mods={Au:Au,Fs:Fs};
    const fs=Fs.getFirestore(app);
    const wrap={doc:p=>({get:async()=>{const s=await Fs.getDoc(Fs.doc(fs,p));return {exists:s.exists(),data:()=>s.data()};},set:d=>Fs.setDoc(Fs.doc(fs,p),d)})};
    WEB.ready=true;
    Au.onAuthStateChanged(WEB.auth,async u=>{
      WEB.user=u||null;
      if(u){await startCloud(wrap,'users/'+u.uid+'/app/state');}
      else{CLOUD.on=false;CLOUD.db=null;}
      await initCaps();
      if(!ui.sheet&&!ui.busy)render(true);
    });
    if(!ui.sheet)render(true);
  }catch(e){WEB.err='লগইন সিস্টেম চালু হয়নি। ইন্টারনেট দেখুন।';if(!ui.sheet)render(true);}
}
function loginCard(forAI){
  if(!window.WEBCFG)return '';
  if(WEB.user){return '<section class="card"><h2>অ্যাকাউন্ট</h2><p class="small">'+esc(WEB.user.email||'')+' দিয়ে লগইন করা আছে। ক্লাউড সেভ চালু'+(WEBCFG.aiProxy?' এবং এআই কোচ চালু':'')+'।</p><button class="btn soft sm" data-act="logout">লগআউট</button></section>';}
  if(WEB.err)return '<section class="card"><h2>লগইন</h2><p class="err">'+esc(WEB.err)+'</p></section>';
  return '<section class="card"><h2>Google দিয়ে লগইন</h2><p class="small muted">লগইন করলে প্রতিদিনের তথ্য ক্লাউডে সেভ হবে, যেকোনো ফোনে একই তথ্য পাবেন'+(forAI?'। এআই চ্যাট ও ছবি-বিশ্লেষণও চালু হবে':'')+'।</p>'+(WEB.ready?'<button class="btn" data-act="login">Google দিয়ে লগইন</button>':'<p class="small muted">লোড হচ্ছে…</p>')+'<p class="err" id="lerr" role="alert"></p></section>';
}
